name: bite_size
description: "A utility app for office lunch logistics & roti counts."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  intl: ^0.20.3
  lottie: ^3.3.3
  provider: ^6.1.2
  octo_image: ^2.1.0
  flutter_svg: ^2.2.3
  url_launcher: ^6.3.2
  skeletonizer: ^2.1.3
  image_picker: ^1.1.2
  firebase_core: ^4.15.0
  flutter_dotenv: ^6.0.1
  google_sign_in: ^6.2.2
  cupertino_icons: ^1.0.8
  clarity_flutter: ^1.10.0
  device_info_plus: ^13.2.0
  supabase_flutter: ^2.6.0
  firebase_messaging: ^16.7.0
  shared_preferences: ^2.5.5
  google_generative_ai: ^0.4.6
  flutter_cache_manager: ^3.4.1
  liquid_pull_to_refresh: ^3.0.1
  change_app_package_name: ^1.5.0
  flutter_local_notifications: ^17.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: 0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/icon/logo.png"
  image_path_android: "assets/icon/logo.png"
  adaptive_icon_background: "assets/icon/bg.png"
  adaptive_icon_foreground: "assets/icon/logo.png"
  adaptive_icon_foreground_inset: 22

flutter:
  uses-material-design: true

  assets:
    - assets/svg/
    - assets/lottie/
    - .env
